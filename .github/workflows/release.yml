# Push a tag like v1.0.0 (must match the VERSION file) to build all packages
# and publish them on a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: |
          if [[ "${GITHUB_REF_NAME}" != "v$(cat VERSION)" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION file (v$(cat VERSION))" >&2
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
